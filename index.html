<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המשימות שלי</title>
  </head>
  <body>
    <h1>המשימות שלי</h1>
    <input type="text" id="task-input" placeholder="משימה חדשה...">
    <button id="add-button">הוסף</button>
    <ul id="task-list"></ul>

    <script>
      // Find the input, the button and the list by their id
      const taskInput = document.getElementById("task-input");
      const addButton = document.getElementById("add-button");
      const taskList = document.getElementById("task-list");

      // When the button is clicked, add the typed text as a new list item
      addButton.addEventListener("click", function () {
        const item = document.createElement("li");
        item.textContent = taskInput.value;
        taskList.appendChild(item);
        taskInput.value = "";
      });
    </script>
  </body>
</html>
