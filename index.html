<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>המשימות שלי</title>
  </head>
  <body>
    <h1>המשימות שלי</h1>
    <form id="task-form">
      <input type="text" id="task-input" placeholder="משימה חדשה...">
      <button type="submit">הוסף</button>
    </form>
    <ul id="task-list"></ul>

    <script>
      // Find the form, the input and the list by their id
      const taskForm = document.getElementById("task-form");
      const taskInput = document.getElementById("task-input");
      const taskList = document.getElementById("task-list");

      // When the form is submitted (button click or Enter), add the typed text as a new list item
      taskForm.addEventListener("submit", function (event) {
        // Stop the browser from reloading the page, which is what a form does by default
        event.preventDefault();

        const text = taskInput.value.trim();

        // Only add a task if something was actually typed
        if (text !== "") {
          const item = document.createElement("li");
          item.textContent = text;
          taskList.appendChild(item);
          taskInput.value = "";
        }
      });
    </script>
  </body>
</html>
